name: Unit Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Find pom.xml
        id: locate
        run: |
          POM=$(find . -name pom.xml -not -path '*/target/*' | head -n 1)
          if [ -z "$POM" ]; then echo "No pom.xml found"; exit 1; fi
          echo "dir=$(dirname "$POM")" >> "$GITHUB_OUTPUT"

      - name: Run JUnit tests
        working-directory: ${{ steps.locate.outputs.dir }}
        run: mvn --batch-mode --no-transfer-progress test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: ${{ steps.locate.outputs.dir }}/target/surefire-reports/
